[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    # every edited bundle carries a content hash in its name, so long caching is safe again
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/developer/*"
  to = "/ui-ux-designer/"
  status = 301
  force = true

[[redirects]]
  from = "/developer"
  to = "/ui-ux-designer/"
  status = 301
  force = true
